name: Pattern evaluation checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - run: OPENBLAS_NUM_THREADS=1 python -m unittest discover -s projects/pattern_evaluation/tests -v
      - name: Run installed planner outside source tree
        run: |
          cd "$RUNNER_TEMP"
          ahead-planner plan --input "$GITHUB_WORKSPACE/projects/pattern_evaluation/artifacts/sample_observation.json" > result.json
          python -c 'import json; r=json.load(open("result.json")); assert r["diagnostics"]["model_status"] == "TRAINED_ARTIFACT"; assert r["action"]["type"] == "PLACE_CURRENT"'
